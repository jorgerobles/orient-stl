[package]
name = "geometry-kernel"
version = "0.1.0"
edition = "2021"
description = "Mesh geometry kernel for STL repair and analysis"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
log = "0.4"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
