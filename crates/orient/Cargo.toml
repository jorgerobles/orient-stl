[package]
name = "orient"
version = "0.1.0"
edition = "2021"
description = "Orientation scoring, ranking, and selection"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "orient"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
geometry-kernel = { path = "../geometry-kernel" }
stl-parse = { path = "../stl-parse" }
stl-repair = { path = "../stl-repair" }
mesher = { path = "../mesher" }
serde = { version = "1", features = ["derive"] }
stl_io = "0.11"

# WASM-only — feature-gated
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3.103", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# CLI-only — feature-gated
serde_json = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["wasm"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys", "console_error_panic_hook"]
cli = ["serde_json", "clap"]
