[package]
name = "stl-repair"
version = "0.1.0"
edition = "2021"
description = "Mesh repair pipeline"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geometry-kernel = { path = "../geometry-kernel" }

# WASM-only — feature-gated
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["wasm"]
wasm = ["wasm-bindgen", "console_error_panic_hook"]

[profile.release]
opt-level = "s"
