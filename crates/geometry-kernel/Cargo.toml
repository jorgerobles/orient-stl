[package]
name = "geometry-kernel"
version = "0.1.0"
edition = "2021"
description = "Mesh geometry kernel for STL repair and analysis"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
